name: Remove v6.0 release

on:
  push:
    branches:
      - stable
    paths:
      - '.github/workflows/remove-v6-release.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/421954953"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v6.0"
